<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JEE 2027 Dropper Syllabus Tracker</title>
<meta name="theme-color" content="#1B2A4A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

// ===========================================================================
// STEP 1 — Paste your Firebase config below (see chat for how to get this).
// Leave as-is and the app still works locally, just without cross-device sync.
// ===========================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCld0wEEeccPfB-wHaKDYd3CsK-02wvJw4",
  authDomain: "jee-checklist-4271d.firebaseapp.com",
  projectId: "jee-checklist-4271d",
  storageBucket: "jee-checklist-4271d.firebasestorage.app",
  messagingSenderId: "1050034317068",
  appId: "1:1050034317068:web:b52966b382d0a220d44b29",
};
const FIREBASE_READY = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

let db = null;
if (FIREBASE_READY) {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
}

// ---------------------------------------------------------------------------
// Data — IIT JEE 2027 Dropper Syllabus Tracker (MathonGo month-wise plan)
// ---------------------------------------------------------------------------

const SUBJECTS_DEF = {
  physics: {
    label: "Physics", code: "P",
    pyqA: "PYQ 2019-22", pyqB: "PYQ 2023-26",
    note: "PYQs of 2019–2022 are to be done before 2023–2026.",
    months: [
      { title: "Till July", chapters: [
        "Mathematics in Physics", "Units and Dimensions", "Motion In One Dimension",
        "Motion In Two Dimensions", "Laws of Motion", "Work Power Energy",
        "COM, Momentum & Collision", "Rotational Motion", "Atomic Physics",
      ]},
      { title: "Till Aug", chapters: [
        "Dual Nature of Matter", "Nuclear Physics", "Kinetic Theory of Gases",
        "Thermal Properties of Matter", "Thermodynamics",
      ]},
      { title: "Till Sep", chapters: [
        "Mechanical Properties of Fluids", "Mechanical Properties of Solids",
        "Oscillation", "Electrostatics", "Gravitation",
      ]},
      { title: "Till Oct", chapters: [
        "Capacitance", "Current Electricity", "Magnetic Effects of Current", "Magnetic Properties of Matter",
      ]},
      { title: "Till Nov", chapters: [
        "Alternating Current", "Electromagnetic Induction", "Wave Optics", "Ray Optics",
      ]},
      { title: "Till 15th Dec", chapters: ["Waves and Sound", "Semiconductors & EM Waves"] },
    ],
  },
  chemistry: {
    label: "Chemistry", code: "C",
    pyqA: "PYQ 2026-23", pyqB: "PYQ 2022-19",
    note: "Do recent years first — last 5 years in reverse order serves the purpose.",
    months: [
      { title: "Till July", chapters: [
        "Some Basic Concepts of Chemistry", "Structure of Atom", "Solutions",
        "Electrochemistry", "Chemical Kinetics", "Chemical Equilibrium", "Ionic Equilibrium",
      ]},
      { title: "Till Aug", chapters: [
        "Redox Reactions", "Thermodynamics (C)", "Periodic Table & Properties", "Chemical Bonding",
      ]},
      { title: "Till Sep", chapters: [
        "General Organic Chemistry", "Isomerism", "Hydrocarbon", "Haloalkanes and Haloarenes",
      ]},
      { title: "Till Oct", chapters: [
        "Alcohols, Phenols and Ethers", "Aldehydes, Ketones", "Carboxylic Acid Derivatives", "Amines",
      ]},
      { title: "Till Nov", chapters: [
        "Biomolecules", "Coordination Compounds", "d and f Block Elements", "p Block Elements",
      ]},
      { title: "Till 15th Dec", chapters: ["Practical Chemistry [Qualitative Analysis]"] },
    ],
  },
  maths: {
    label: "Mathematics", code: "M",
    pyqA: "PYQ 2026-23", pyqB: "PYQ 2022-19",
    note: "Do recent years first — 2022 is a challenge, practice only well-prepared chapters.",
    months: [
      { title: "Till July", chapters: [
        "Basic of Mathematics", "Quadratic Equation", "Sequences and Series",
        "Trigonometric Functions", "Trigonometric Equation", "Permutations and Combinations", "Binomial theorem",
      ]},
      { title: "Till Aug", chapters: ["Straight Lines", "Circle", "Parabola", "Ellipse", "Hyperbola"] },
      { title: "Till Sep", chapters: [
        "Matrices", "Determinants", "Sets and Relations", "Functions", "Inverse Trigonometry",
      ]},
      { title: "Till Oct", chapters: [
        "Limits", "Continuity and Differentiability", "Application of Derivatives",
        "Indefinite Integration", "Definite Integration",
      ]},
      { title: "Till Nov", chapters: [
        "Area Under Curves", "Differential Equations", "Vector Algebra", "Three-Dimensional Geometry",
      ]},
      { title: "Till 15th Dec", chapters: ["Complex Number", "Probability", "Statistics"] },
    ],
  },
};

const ADVANCED_ONLY_DEFS = {
  physics: [
    "Communication Systems (full chapter)", "Carnot Engine & Efficiency",
    "Doppler Effect (sound)", "Damped, Forced Oscillations & Resonance",
    "Potentiometer", "Cyclotron", "Earth's Magnetism & Hysteresis",
    "Davisson–Germer Experiment", "Transistor Action & Characteristics",
  ],
  chemistry: [
    "States of Matter (gaseous & liquid)", "Surface Chemistry",
    "Hydrogen and its Compounds", "s-Block Elements",
    "General Principles of Metallurgy", "Environmental Chemistry",
    "Polymers", "Chemistry in Everyday Life",
  ],
  maths: [
    "Mathematical Induction (full chapter)", "Mathematical Reasoning (full chapter)",
    "Heights & Distances", "Bernoulli Trials & Binomial Distribution",
  ],
};

const SUBJECT_KEYS = ["physics", "chemistry", "maths"];

function buildStructure() {
  const out = {};
  SUBJECT_KEYS.forEach((k) => {
    let n = 1;
    out[k] = [];
    SUBJECTS_DEF[k].months.forEach((m) => {
      m.chapters.forEach((name) => {
        out[k].push({ id: `${SUBJECTS_DEF[k].code.toLowerCase()}${n}`, month: m.title, name });
        n++;
      });
    });
  });
  return out;
}

function buildAdvStructure() {
  const out = {};
  SUBJECT_KEYS.forEach((k) => {
    out[k] = ADVANCED_ONLY_DEFS[k].map((name, i) => ({
      id: `adv-${SUBJECTS_DEF[k].code.toLowerCase()}${i + 1}`,
      name,
    }));
  });
  return out;
}

function genId(prefix) {
  return `${prefix}-${Date.now().toString(36)}${Math.floor(Math.random() * 1e4).toString(36)}`;
}

const emptyProgress = () => ({ theory: false, module: false, pyq: false });

const defaultState = () => ({
  structure: buildStructure(),
  advStructure: buildAdvStructure(),
  progress: {},
  advChecked: {},
});

// ---------------------------------------------------------------------------

function App() {
  const [state, setState] = useState(null); // { structure, advStructure, progress, advChecked }
  const [active, setActive] = useState("physics");
  const [showAddendum, setShowAddendum] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editingValue, setEditingValue] = useState("");
  const [addingTarget, setAddingTarget] = useState(null);
  const [addValue, setAddValue] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [syncCode, setSyncCode] = useState(() => localStorage.getItem("jee-sync-code") || "");
  const [showSyncPanel, setShowSyncPanel] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const [syncStatus, setSyncStatus] = useState("local"); // local | connecting | synced | error

  const applyingRemote = useRef(false);
  const unsubRef = useRef(null);

  // ---- initial local load (fallback / pre-sync state) --------------------
  useEffect(() => {
    let initial = defaultState();
    try {
      const s = localStorage.getItem("jee-dropper-state");
      if (s) initial = JSON.parse(s);
    } catch (e) {}
    setState(initial);
    setLoaded(true);
  }, []);

  // ---- attach/detach Firestore listener when syncCode changes ------------
  useEffect(() => {
    if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; }
    if (!FIREBASE_READY || !syncCode) { setSyncStatus(syncCode ? "error" : "local"); return; }
    setSyncStatus("connecting");
    const ref = db.collection("jee-trackers").doc(syncCode);
    unsubRef.current = ref.onSnapshot(
      (snap) => {
        if (snap.exists) {
          applyingRemote.current = true;
          setState(snap.data().payload);
          setSyncStatus("synced");
        } else {
          // seed the cloud doc with current local state
          ref.set({ payload: state || defaultState(), updatedAt: Date.now() });
          setSyncStatus("synced");
        }
      },
      (err) => { console.error(err); setSyncStatus("error"); }
    );
    return () => { if (unsubRef.current) unsubRef.current(); };
    // eslint-disable-next-line
  }, [syncCode]);

  // ---- persist on every state change (local + cloud) ----------------------
  useEffect(() => {
    if (!loaded || !state) return;
    try { localStorage.setItem("jee-dropper-state", JSON.stringify(state)); } catch (e) {}
    if (applyingRemote.current) { applyingRemote.current = false; return; }
    if (FIREBASE_READY && syncCode && db) {
      db.collection("jee-trackers").doc(syncCode)
        .set({ payload: state, updatedAt: Date.now() })
        .catch((e) => { console.error(e); setSyncStatus("error"); });
    }
  }, [state, loaded, syncCode]);

  const update = (fn) => setState((prev) => fn(prev));

  const getProg = (id) => (state.progress[id] || emptyProgress());

  const setField = (id, field, value) => {
    update((prev) => ({ ...prev, progress: { ...prev.progress, [id]: { ...(prev.progress[id] || emptyProgress()), [field]: value } } }));
  };
  const toggleBool = (id, field) => setField(id, field, !getProg(id)[field]);

  const toggleAdv = (id) => {
    update((prev) => ({ ...prev, advChecked: { ...prev.advChecked, [id]: !prev.advChecked[id] } }));
  };

  const resetAll = () => {
    update((prev) => ({ ...prev, progress: {}, advChecked: {} }));
  };

  const startEdit = (item) => { setEditingId(item.id); setEditingValue(item.name); };
  const cancelEdit = () => { setEditingId(null); setEditingValue(""); };
  const commitEdit = (subject, isAdv) => {
    const name = editingValue.trim();
    if (!name) return cancelEdit();
    update((prev) => {
      if (isAdv) {
        return { ...prev, advStructure: { ...prev.advStructure, [subject]: prev.advStructure[subject].map((it) => (it.id === editingId ? { ...it, name } : it)) } };
      }
      return { ...prev, structure: { ...prev.structure, [subject]: prev.structure[subject].map((it) => (it.id === editingId ? { ...it, name } : it)) } };
    });
    cancelEdit();
  };

  const removeChapter = (subject, id, isAdv) => {
    if (!window.confirm("Remove this chapter?")) return;
    update((prev) => {
      if (isAdv) {
        const advChecked = { ...prev.advChecked }; delete advChecked[id];
        return { ...prev, advChecked, advStructure: { ...prev.advStructure, [subject]: prev.advStructure[subject].filter((it) => it.id !== id) } };
      }
      const progress = { ...prev.progress }; delete progress[id];
      return { ...prev, progress, structure: { ...prev.structure, [subject]: prev.structure[subject].filter((it) => it.id !== id) } };
    });
  };

  const startAdd = (target) => { setAddingTarget(target); setAddValue(""); };
  const cancelAdd = () => { setAddingTarget(null); setAddValue(""); };
  const submitAdd = () => {
    const name = addValue.trim();
    if (!name || !addingTarget) return;
    update((prev) => {
      if (addingTarget.type === "mains") {
        const id = genId(SUBJECTS_DEF[addingTarget.subject].code.toLowerCase());
        return { ...prev, structure: { ...prev.structure, [addingTarget.subject]: [...prev.structure[addingTarget.subject], { id, month: addingTarget.month, name }] } };
      }
      const id = genId("adv-" + SUBJECTS_DEF[addingTarget.subject].code.toLowerCase());
      return { ...prev, advStructure: { ...prev.advStructure, [addingTarget.subject]: [...prev.advStructure[addingTarget.subject], { id, name }] } };
    });
    cancelAdd();
  };

  const stats = useMemo(() => {
    if (!state) return { perSubject: {}, totalDone: 0, totalAll: 0, pct: 0 };
    const perSubject = {};
    let totalDone = 0, totalAll = 0;
    SUBJECT_KEYS.forEach((k) => {
      const items = state.structure[k] || [];
      const done = items.filter((it) => {
        const p = state.progress[it.id] || emptyProgress();
        return p.theory && p.module && p.pyq;
      }).length;
      perSubject[k] = { done, all: items.length, pct: items.length ? Math.round((done / items.length) * 100) : 0 };
      totalDone += done; totalAll += items.length;
    });
    return { perSubject, totalDone, totalAll, pct: totalAll ? Math.round((totalDone / totalAll) * 100) : 0 };
  }, [state]);

  const createOrJoinCode = (code) => {
    const c = code.trim();
    if (!c) return;
    localStorage.setItem("jee-sync-code", c);
    setSyncCode(c);
    setShowSyncPanel(false);
    setCodeInput("");
  };
  const leaveSync = () => {
    localStorage.removeItem("jee-sync-code");
    setSyncCode("");
    setSyncStatus("local");
  };

  if (!loaded || !state) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#F3F1E9", fontFamily: "'IBM Plex Mono', monospace", color: "#1B2A4A" }}>
        loading form…
      </div>
    );
  }

  const subj = SUBJECTS_DEF[active];
  const monthTitlesFor = (k) => SUBJECTS_DEF[k].months.map((m) => m.title);
  const itemsInMonth = (k, title) => state.structure[k].filter((it) => it.month === title);

  const Pill = ({ id, field, label }) => {
    const on = getProg(id)[field];
    return <button className={`pill ${on ? "on" : ""}`} onClick={() => toggleBool(id, field)}>{label}</button>;
  };

  const syncLabel = FIREBASE_READY
    ? (syncCode ? (syncStatus === "synced" ? `🔗 Synced · ${syncCode}` : syncStatus === "connecting" ? "🔗 Connecting…" : "⚠ Sync error") : "🔗 Set up sync")
    : "🔗 Sync (not configured)";

  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        ::selection { background: #E8C4B8; }
        .pill { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; padding: 5px 8px; border-radius: 4px; border: 1.5px solid rgba(27,42,74,0.35); background: #FFFDF6; color: #1B2A4A; cursor: pointer; }
        .pill.on { background: #1B2A4A; border-color: #1B2A4A; color: #FFFDF6; }
        .icon-btn { background: transparent; border: none; cursor: pointer; font-size: 13px; padding: 4px 6px; opacity: 0.6; }
        .icon-btn:hover { opacity: 1; }
        .edit-input { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; padding: 5px 8px; border: 1.5px solid #1B2A4A; border-radius: 4px; flex: 1; background: #FFFDF6; color: #1B2A4A; }
        .chapter-card { border-bottom: 1px solid rgba(27,42,74,0.1); padding: 12px 2px; }
        .chapter-card:last-child { border-bottom: none; }
        .sync-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 5px; border: 1.5px solid #1B2A4A; background: transparent; color: #1B2A4A; cursor: pointer; white-space: nowrap; }
      `}</style>

      <div style={styles.header}>
        <div style={styles.headerTopRow}>
          <div>
            <div style={styles.eyebrow}>MATHONGO · DROPPER PLAN</div>
            <h1 style={styles.title}>JEE 2027 Syllabus Tracker</h1>
          </div>
          <div style={styles.formCode}>FORM&nbsp;NO.<br />JM/27/DRP</div>
        </div>

        <div style={{ maxWidth: 720, margin: "14px auto 0", display: "flex", justifyContent: "flex-end" }}>
          <button className="sync-btn" onClick={() => setShowSyncPanel((s) => !s)}>{syncLabel}</button>
        </div>

        {showSyncPanel && (
          <div style={styles.syncPanel}>
            {!FIREBASE_READY ? (
              <p style={styles.syncNote}>Sync isn't configured in this file yet — add your Firebase config at the top of the HTML. Ask me for the steps if you haven't set this up.</p>
            ) : syncCode ? (
              <>
                <p style={styles.syncNote}>This device is synced with code <b>{syncCode}</b>. Enter the same code on your other device to link it.</p>
                <button style={styles.resetBtn} onClick={leaveSync}>Stop syncing this device</button>
              </>
            ) : (
              <>
                <p style={styles.syncNote}>Create a code on your first device, then enter that same code here on your other device.</p>
                <div style={{ display: "flex", gap: 8 }}>
                  <input className="edit-input" placeholder="e.g. rahul-jee-2027" value={codeInput} onChange={(e) => setCodeInput(e.target.value)} />
                  <button className="sync-btn" onClick={() => createOrJoinCode(codeInput)}>Connect</button>
                </div>
              </>
            )}
          </div>
        )}

        <div style={styles.scoreStrip}>
          <div style={styles.scoreBig}>{stats.totalDone}<span style={styles.scoreOf}>/{stats.totalAll}</span></div>
          <div style={{ flex: 1 }}>
            <div style={styles.scoreLabel}>FULLY REVISED (T+M+PYQ) &nbsp;·&nbsp; {stats.pct}%</div>
            <div style={styles.track}><div style={{ ...styles.trackFill, width: `${stats.pct}%` }} /></div>
          </div>
          <button style={{ ...styles.editToggle, ...(editMode ? styles.editToggleActive : {}) }} onClick={() => { setEditMode((e) => !e); cancelEdit(); cancelAdd(); }}>
            {editMode ? "✓ Done" : "✎ Edit"}
          </button>
        </div>
      </div>

      <div style={styles.tabs}>
        {SUBJECT_KEYS.map((k) => (
          <button key={k} onClick={() => setActive(k)} style={{ ...styles.tabBtn, ...(active === k ? styles.tabBtnActive : {}) }}>
            <span style={styles.tabCode}>{SUBJECTS_DEF[k].code}</span>
            {SUBJECTS_DEF[k].label}
            <span style={styles.tabPct}>{stats.perSubject[k].pct}%</span>
          </button>
        ))}
      </div>

      <div style={styles.legend}>
        <div>{subj.note}</div>
      </div>

      <div style={styles.sheet}>
        {monthTitlesFor(active).map((title) => {
          const items = itemsInMonth(active, title);
          const isAddingHere = addingTarget && addingTarget.type === "mains" && addingTarget.subject === active && addingTarget.month === title;
          return (
            <div key={title} style={{ marginBottom: 22 }}>
              <div style={styles.groupTitle}>{title}</div>
              {items.map((item, i) => {
                const isEditing = editingId === item.id;
                return (
                  <div className="chapter-card" key={item.id}>
                    {isEditing ? (
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <input className="edit-input" autoFocus value={editingValue}
                          onChange={(e) => setEditingValue(e.target.value)}
                          onKeyDown={(e) => { if (e.key === "Enter") commitEdit(active, false); if (e.key === "Escape") cancelEdit(); }} />
                        <button className="icon-btn" onClick={() => commitEdit(active, false)}>✓</button>
                        <button className="icon-btn" onClick={cancelEdit}>✕</button>
                      </div>
                    ) : (
                      <>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <span style={styles.rowIndex}>{subj.code}{String(i + 1).padStart(2, "0")}</span>
                          <span style={{ ...styles.rowText, flex: 1 }}>{item.name}</span>
                          {editMode && (
                            <>
                              <button className="icon-btn" onClick={() => startEdit(item)}>✎</button>
                              <button className="icon-btn" onClick={() => removeChapter(active, item.id, false)}>✕</button>
                            </>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                          <Pill id={item.id} field="theory" label="Theory" />
                          <Pill id={item.id} field="module" label="Module 50-60Q" />
                          <Pill id={item.id} field="pyq" label="PYQ" />
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
              {editMode && (
                isAddingHere ? (
                  <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
                    <input className="edit-input" autoFocus placeholder="New chapter name" value={addValue}
                      onChange={(e) => setAddValue(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") submitAdd(); if (e.key === "Escape") cancelAdd(); }} />
                    <button className="icon-btn" onClick={submitAdd}>✓</button>
                    <button className="icon-btn" onClick={cancelAdd}>✕</button>
                  </div>
                ) : (
                  <button style={styles.addChapterBtn} onClick={() => startAdd({ type: "mains", subject: active, month: title })}>+ Add chapter</button>
                )
              )}
            </div>
          );
        })}
      </div>

      <div style={styles.addendumWrap}>
        <button style={styles.addendumToggle} onClick={() => setShowAddendum((s) => !s)}>
          <span style={styles.stamp}>ADVANCED ONLY</span>
          <span>Not in JEE Main syllabus — {showAddendum ? "hide" : "show"} addendum</span>
          <span style={{ marginLeft: "auto", fontSize: 18 }}>{showAddendum ? "−" : "+"}</span>
        </button>
        {showAddendum && (
          <div style={styles.addendumBody}>
            <p style={styles.addendumNote}>
              These chapters/topics appear in the JEE Advanced syllabus but not the Main dropper plan above — a simple checklist, separate from monthly progress.
            </p>
            {SUBJECT_KEYS.map((k) => {
              const isAddingHere = addingTarget && addingTarget.type === "adv" && addingTarget.subject === k;
              return (
                <div key={k} style={{ marginBottom: 18 }}>
                  <div style={styles.groupTitle}>{SUBJECTS_DEF[k].label}</div>
                  {state.advStructure[k].map((topic, i) => {
                    const isChecked = !!state.advChecked[topic.id];
                    const isEditing = editingId === topic.id;
                    return (
                      <div className="chapter-card" key={topic.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        {isEditing ? (
                          <>
                            <input className="edit-input" autoFocus value={editingValue}
                              onChange={(e) => setEditingValue(e.target.value)}
                              onKeyDown={(e) => { if (e.key === "Enter") commitEdit(k, true); if (e.key === "Escape") cancelEdit(); }} />
                            <button className="icon-btn" onClick={() => commitEdit(k, true)}>✓</button>
                            <button className="icon-btn" onClick={cancelEdit}>✕</button>
                          </>
                        ) : (
                          <>
                            <div onClick={() => toggleAdv(topic.id)} style={{ width: 20, height: 20, border: "2px solid #B54B3A", borderRadius: "50%", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
                              {isChecked && <div style={{ width: 11, height: 11, borderRadius: "50%", background: "#B54B3A" }} />}
                            </div>
                            <span style={{ ...styles.rowText, textDecoration: isChecked ? "line-through" : "none", opacity: isChecked ? 0.5 : 1, flex: 1 }}>{topic.name}</span>
                            {editMode && (
                              <>
                                <button className="icon-btn" onClick={() => startEdit(topic)}>✎</button>
                                <button className="icon-btn" onClick={() => removeChapter(k, topic.id, true)}>✕</button>
                              </>
                            )}
                          </>
                        )}
                      </div>
                    );
                  })}
                  {editMode && (
                    isAddingHere ? (
                      <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
                        <input className="edit-input" autoFocus placeholder="New topic name" value={addValue}
                          onChange={(e) => setAddValue(e.target.value)}
                          onKeyDown={(e) => { if (e.key === "Enter") submitAdd(); if (e.key === "Escape") cancelAdd(); }} />
                        <button className="icon-btn" onClick={submitAdd}>✓</button>
                        <button className="icon-btn" onClick={cancelAdd}>✕</button>
                      </div>
                    ) : (
                      <button style={styles.addChapterBtn} onClick={() => startAdd({ type: "adv", subject: k, month: null })}>+ Add topic</button>
                    )
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={styles.footer}>
        <button style={styles.resetBtn} onClick={resetAll}>Reset all progress</button>
        <span style={styles.footerNote}>Month-wise plan per MathonGo's IIT JEE 2027 Dropper Syllabus Tracker. Tap ✎ Edit to add, rename, or remove chapters. Set up 🔗 Sync to share progress across devices.</span>
      </div>
    </div>
  );
}
